# Catálogo de casos de prueba de QualityOps AI (T34).
# Componentes de cada caso: identificador, tipo, técnica, descripción, datos de entrada,
# pasos de ejecución, resultado esperado y resultado obtenido.
#  - Casos automáticos: el resultado obtenido lo llena el Centro de pruebas al ejecutar pytest
#    (la prueba se llama test_<id en minúsculas>..., o la indicada en `prueba`).
#  - Casos manuales: `obtenido`, `estado` y `evidencia` se escriben después de ejecutarlos.

# ---------------------------------------------------------------- Pruebas manuales
