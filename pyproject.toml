# Configuración de QualityOps AI (T09) y umbrales del quality gate (T10).
# Un solo archivo para que cualquier persona vea, en un lugar, cómo se valida el proyecto.

[tool.pytest.ini_options]
# Dónde están las pruebas automatizadas.
testpaths = ["tests"]

[tool.ruff]
# Versión mínima de Python que soporta el código (usa tomllib y "str | None").
target-version = "py311"

[tool.qualityops.umbrales]
# Criterios que una versión debe cumplir para poder integrarse (enfoque preventivo).
# Cobertura: 75 % = nivel "encomiable" según Arguelles et al. (2020), Google Testing Blog.
cobertura_minima = 75.0
# Complejidad: ninguna función puede superar CC 10 = bajo riesgo según McCabe (1976).
complejidad_maxima = 10

[tool.qualityops.calendario]
# Fecha planeada de cada sprint (plan maestro). Las métricas de plazos comparan
# contra esta fecha la fecha REAL de cierre de cada tarea (data/time_log.csv).
S0 = "2026-10-04"
S1A = "2026-10-05"
S1B = "2026-10-05"
S1C = "2026-10-05"
S1D = "2026-10-05"
S2A = "2026-10-06"
S2B = "2026-10-06"
S2C = "2026-10-06"
S2D = "2026-10-06"
S3A = "2026-10-07"
